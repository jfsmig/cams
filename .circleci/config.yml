# See: https://circleci.com/docs/2.0/configuration-reference
#
# The checks themselves live in ci/, shared with .github/workflows/ci.yml, so
# that the two CI systems cannot drift apart. Both run them in the same image.
version: 2.1

jobs:
  go:
    docker:
      - image: jfsmig/cams-ci:latest
    steps:
      - checkout
      - run:
          name: Go
          command: ./ci/go.sh

  cpp:
    docker:
      - image: jfsmig/cams-ci:latest
    steps:
      - checkout
      - run:
          name: C++
          command: ./ci/cpp.sh

workflows:
  build-and-test-workflow:
    jobs:
      - go
      - cpp
